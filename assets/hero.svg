<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shucheng (Bangli) Cao — statistical and causal genetics, Mendelian randomization, AI agents for drug-target evidence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="55%" stop-color="#123B63"/>
      <stop offset="100%" stop-color="#1C7293"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5FB3CE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5FB3CE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5FB3CE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5FB3CE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name  { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
      .ui    { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .mono  { font-family: "SF Mono", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="930" cy="150" r="230" fill="url(#glow)"/>

  <!-- ── left: who ─────────────────────────────────────────────────────────── -->
  <text class="name" x="72" y="118" font-size="52" font-weight="700" fill="#FFFFFF">Shucheng (Bangli) Cao</text>
  <rect x="74" y="140" width="360" height="2.5" fill="url(#rule)"/>
  <text class="ui" x="72" y="180" font-size="20" fill="#CFE3EE">PhD candidate, Quantitative Life Sciences · McGill University</text>
  <text class="ui" x="72" y="215" font-size="19" fill="#8FBBD1">Statistical &amp; causal genetics · Mendelian randomization</text>
  <text class="ui" x="72" y="243" font-size="19" fill="#8FBBD1">AI agents that turn public databases into checkable evidence</text>

  <!-- ── right: the causal chain the work is about ─────────────────────────── -->
  <g transform="translate(700,150)">
    <!-- confounder, dashed, cannot reach the variant -->
    <text class="mono" x="150" y="-84" font-size="14" fill="#7FA6BD" text-anchor="middle">confounders</text>
    <path d="M138,-66 L156,-38" stroke="#7FA6BD" stroke-width="1.6" stroke-dasharray="5 5" fill="none" opacity="0.85"/>
    <polygon points="158,-33 150,-40 160,-42" fill="#7FA6BD" opacity="0.85"/>
    <path d="M176,-66 L278,-36" stroke="#7FA6BD" stroke-width="1.6" stroke-dasharray="5 5" fill="none" opacity="0.85"/>
    <polygon points="284,-34 274,-33 277,-42" fill="#7FA6BD" opacity="0.85"/>

    <!-- G -> X -> Y -->
    <line x1="42" y1="0" x2="118" y2="0" stroke="#CFE3EE" stroke-width="2.4"/>
    <polygon points="118,0 108,-5.5 108,5.5" fill="#CFE3EE"/>
    <line x1="182" y1="0" x2="258" y2="0" stroke="#CFE3EE" stroke-width="2.4"/>
    <polygon points="258,0 248,-5.5 248,5.5" fill="#CFE3EE"/>

    <circle cx="10" cy="0" r="31" fill="#0B2545" stroke="#5FB3CE" stroke-width="2.2"/>
    <text class="mono" x="10" y="7" font-size="20" fill="#FFFFFF" text-anchor="middle">G</text>
    <text class="ui" x="10" y="56" font-size="13" fill="#8FBBD1" text-anchor="middle">variant</text>

    <circle cx="150" cy="0" r="31" fill="#0B2545" stroke="#5FB3CE" stroke-width="2.2"/>
    <text class="mono" x="150" y="7" font-size="20" fill="#FFFFFF" text-anchor="middle">X</text>
    <text class="ui" x="150" y="56" font-size="13" fill="#8FBBD1" text-anchor="middle">protein</text>

    <circle cx="290" cy="0" r="31" fill="#0B2545" stroke="#7ED6A5" stroke-width="2.2"/>
    <text class="mono" x="290" y="7" font-size="20" fill="#FFFFFF" text-anchor="middle">Y</text>
    <text class="ui" x="290" y="56" font-size="13" fill="#8FBBD1" text-anchor="middle">disease</text>

    <text class="ui" x="150" y="92" font-size="13" fill="#6E93A8" text-anchor="middle" font-style="italic">the arrow only runs forward</text>
  </g>
</svg>
