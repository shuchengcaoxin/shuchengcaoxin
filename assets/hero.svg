<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Shucheng Cao, causal genetics and research software</title>
  <desc id="desc">An editorial-style profile banner showing Shucheng Cao, also known as Bangli Cao, and a variant-to-protein-to-disease causal path.</desc>

  <rect width="1200" height="260" fill="#193C33"/>
  <path d="M0 0H1200V8H0Z" fill="#D2917C"/>

  <!-- identity -->
  <g transform="translate(68 47)">
    <text x="0" y="0" fill="#D2917C" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.2">CAUSAL GENETICS / RESEARCH SOFTWARE</text>
    <text x="0" y="69" fill="#F3F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" letter-spacing="-1.2">Shucheng Cao</text>
    <text x="2" y="105" fill="#AFC2BA" font-family="Georgia, 'Times New Roman', serif" font-size="22">(Bangli Cao) · 曹书诚</text>
    <line x1="2" y1="132" x2="500" y2="132" stroke="#55786D" stroke-width="1"/>
    <text x="2" y="160" fill="#F3F0E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15">PhD candidate · McGill University · Montréal</text>
  </g>

  <line x1="672" y1="40" x2="672" y2="220" stroke="#55786D" stroke-width="1"/>

  <!-- causal path -->
  <g transform="translate(738 46)">
    <text x="0" y="0" fill="#AFC2BA" font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.6">ONE QUESTION, SEVERAL CHECKS</text>

    <g transform="translate(6 45)">
      <line x1="48" y1="39" x2="156" y2="39" stroke="#83B8A5" stroke-width="2"/>
      <path d="M156 39L146 33V45Z" fill="#83B8A5"/>
      <line x1="210" y1="39" x2="318" y2="39" stroke="#83B8A5" stroke-width="2"/>
      <path d="M318 39L308 33V45Z" fill="#83B8A5"/>

      <circle cx="28" cy="39" r="27" fill="#193C33" stroke="#83B8A5" stroke-width="2"/>
      <circle cx="190" cy="39" r="27" fill="#193C33" stroke="#83B8A5" stroke-width="2"/>
      <circle cx="352" cy="39" r="27" fill="#193C33" stroke="#D2917C" stroke-width="2"/>

      <g fill="#F3F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" text-anchor="middle">
        <text x="28" y="46">G</text>
        <text x="190" y="46">X</text>
        <text x="352" y="46">Y</text>
      </g>
      <g fill="#AFC2BA" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.2" text-anchor="middle">
        <text x="28" y="83">VARIANT</text>
        <text x="190" y="83">PROTEIN</text>
        <text x="352" y="83">DISEASE</text>
      </g>
    </g>

    <line x1="6" y1="156" x2="358" y2="156" stroke="#55786D" stroke-width="1"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12">
      <circle cx="12" cy="181" r="3.5" fill="#83B8A5"/>
      <text x="24" y="185" fill="#F3F0E8">replication</text>
      <circle cx="129" cy="181" r="3.5" fill="#83B8A5"/>
      <text x="141" y="185" fill="#F3F0E8">colocalization</text>
      <circle cx="268" cy="181" r="3.5" fill="#D2917C"/>
      <text x="280" y="185" fill="#F3F0E8">sensitivity</text>
    </g>
  </g>
</svg>
