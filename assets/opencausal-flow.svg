<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="title desc">
  <title id="title">How OpenCausal builds an evidence card</title>
  <desc id="desc">Published Mendelian randomization estimates and eight downstream databases enter an evidence ledger, then deterministic code renders a card that must pass a validation gate.</desc>

  <rect x="1" y="1" width="1198" height="248" fill="#F3F0E8" stroke="#CBC7BB" stroke-width="2"/>

  <text x="54" y="42" fill="#193C33" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="600">How one OpenCausal evidence card is built</text>
  <text x="1146" y="41" fill="#94513F" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.6" text-anchor="end">EVIDENCE BEFORE NARRATIVE</text>
  <line x1="54" y1="57" x2="1146" y2="57" stroke="#CBC7BB" stroke-width="1"/>

  <!-- inputs -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="54" y="86" width="230" height="52" rx="3" fill="#FBFAF6" stroke="#55786D" stroke-width="1.5"/>
    <text x="70" y="108" fill="#193C33" font-size="14" font-weight="700">Published MR estimates</text>
    <text x="70" y="126" fill="#69716B" font-size="11">retrieved with source metadata</text>

    <rect x="54" y="150" width="230" height="52" rx="3" fill="#FBFAF6" stroke="#55786D" stroke-width="1.5"/>
    <text x="70" y="172" fill="#193C33" font-size="14" font-weight="700">8 downstream databases</text>
    <text x="70" y="190" fill="#69716B" font-size="11">genetics · biology · drug development</text>
  </g>

  <path d="M284 112H305C318 112 318 144 331 144H342" fill="none" stroke="#83B8A5" stroke-width="2"/>
  <path d="M284 176H305C318 176 318 144 331 144H342" fill="none" stroke="#83B8A5" stroke-width="2"/>
  <path d="M342 144L332 138V150Z" fill="#83B8A5"/>

  <!-- ledger -->
  <rect x="350" y="99" width="210" height="90" rx="3" fill="#193C33"/>
  <text x="455" y="135" fill="#F3F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="middle">Evidence ledger</text>
  <text x="455" y="158" fill="#AFC2BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle">each answer kept with its source</text>

  <line x1="560" y1="144" x2="611" y2="144" stroke="#83B8A5" stroke-width="2"/>
  <path d="M611 144L601 138V150Z" fill="#83B8A5"/>

  <!-- render -->
  <rect x="620" y="99" width="210" height="90" rx="3" fill="#DFE8E2" stroke="#83B8A5" stroke-width="1.5"/>
  <text x="725" y="135" fill="#193C33" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="middle">Code renders</text>
  <text x="725" y="158" fill="#56605A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle">one inspectable evidence card</text>

  <line x1="830" y1="144" x2="881" y2="144" stroke="#83B8A5" stroke-width="2"/>
  <path d="M881 144L871 138V150Z" fill="#83B8A5"/>

  <!-- validation -->
  <rect x="890" y="99" width="256" height="90" rx="3" fill="#FBFAF6" stroke="#94513F" stroke-width="2"/>
  <text x="1018" y="132" fill="#193C33" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="middle">Validation gate</text>
  <text x="1018" y="154" fill="#69716B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" text-anchor="middle">unsupported claims are exposed</text>
  <text x="1018" y="173" fill="#94513F" font-family="Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing=".7" text-anchor="middle">PASS  /  FAIL — NEVER HIDDEN</text>

  <text x="54" y="226" fill="#69716B" font-family="Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing=".7">9 PUBLIC DATA SOURCES · SOURCE TEXT RETAINED · DETERMINISTIC OUTPUT · 62 VALIDATION CHECKS</text>
</svg>
